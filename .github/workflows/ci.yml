name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: sqlfluff
        env:
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
        run: |
          mkdir -p data
          sqlfluff lint dbt/models dbt/tests
      - name: generated catalogs and structure
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python scripts/render_skills.py --check
          python scripts/render_metrics.py --check
          python scripts/validate_structure.py
          python scripts/check_language.py

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: synthetic warehouse, dbt build, request close
        run: |
          python scripts/prepare_data.py --mode synthetic
          dbt build --project-dir dbt --profiles-dir dbt
          python scripts/run_request.py
          python automations/monthly-close/run.py
          python quick-checks/2018-08-20-freight-share/check.py

  leak:
    name: leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - name: denylist
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -n "$LEAK_DENYLIST" ]; then
            printf '%s\n' "$LEAK_DENYLIST" > .leak-denylist.txt
          fi
          python3 scripts/gates/leak_scan.py
