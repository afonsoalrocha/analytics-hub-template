id: average_ticket
name: Average ticket
status: certificada
definition: >
  Item price plus freight, divided by delivered orders, in the month of the purchase.
formula:
  numerator: sum(price) + sum(freight_value)
  denominator: count(distinct order_id)
  aggregation: ratio
grain: delivered order rolled up to purchase_month
default_date_column: order_purchase_timestamp
required_filters:
  - order_status = 'delivered'
  - complete calendar months only
allowed_dimensions:
  - name: purchase_month
    caution: ""
  - name: customer_state
    caution: >
      A state with a handful of orders can swing the ticket. Publish the
      order count beside any state cut.
maturity_days: 0
reconciliation_source: >
  The numerator is the item GMV that the reconciliation gate compares with
  payment_value. The denominator is delivered_orders.
owner: template maintainer
decided_at: 2026-11-10
block_reason: null
history:
  - "on": "2026-11-10"
    change: Initial definition for the public Olist example. Ticket includes freight; product revenue does not.
