id: visit_to_order_conversion
name: Visit-to-order conversion
status: bloqueada
definition: >
  Delivered orders divided by visits. The public dataset has orders and no visits.
formula:
  numerator: count(distinct order_id)
  denominator: count of visits or sessions
  aggregation: ratio
grain: session_id, which this dataset does not contain
default_date_column: session_date
required_filters: []
allowed_dimensions:
  - name: purchase_month
    caution: >
      A monthly rate would still need a visit denominator for that same month.
maturity_days: 0
reconciliation_source: >
  A web-analytics property, reconciled to orders on a shared time window.
  None is connected in this template.
owner: template maintainer
decided_at: 2026-11-10
block_reason: >
  The Olist public dataset has no visit or session table. Publishing a
  conversion rate would invent the denominator. The metric stays blocked
  until a traffic source is connected and reconciled to orders.
history:
  - "on": "2026-11-10"
    change: Blocked at creation because the example dataset cannot support the question.
