[project]
name = "analytics-hub-template"
version = "0.1.0"
description = "A request-driven, deterministic analytics workspace. Humans decide, agents implement, gates publish."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Afonso Rocha" }]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests", "automations", "quick-checks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"automations/**/run.py" = ["E402"]
