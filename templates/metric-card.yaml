id: metric_id
name: Business name
status: certificada
definition: One sentence a colleague outside the data team can repeat.
formula:
  numerator: count(distinct order_id)
  denominator: null
  aggregation: count_distinct
grain: the source row, and the rollup you publish
default_date_column: event_timestamp
required_filters:
  - status = 'delivered'
allowed_dimensions:
  - name: month
    caution: ""
maturity_days: 0
reconciliation_source: The independent total this metric must be compared with.
owner: role of the person who decided
decided_at: 2026-11-10
block_reason: null
history:
  - "on": "2026-11-10"
    change: Initial definition.
