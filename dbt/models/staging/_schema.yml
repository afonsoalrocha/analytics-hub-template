version: 2

models:
  - name: stg_orders
    description: Typed orders. purchase_month is the demand clock.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_status
        tests:
          - not_null
      - name: purchase_date
        tests:
          - not_null
      - name: purchase_month
        tests:
          - not_null
  - name: stg_order_items
    description: Typed item rows. price excludes freight.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null
  - name: stg_customers
    description: Order-level customer id and the stable person id.
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null
  - name: stg_payments
    description: Payment lines used as the reconciliation source.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null
